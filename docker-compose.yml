services:
  db:
    image: pgrouting/pgrouting:latest
    container_name: dispatch-geo-db
    environment:
      POSTGRES_DB: dispatch_geo_db
      POSTGRES_USER: example
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5436}:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - ./benchmarks:/benchmarks:ro
      - ./tests:/tests:ro
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U example -d dispatch_geo_db"]
      interval: 3s
      timeout: 3s
      retries: 10