version: "3.8"
services:
  db:
    image: postgis/postgis:15-3.3-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: example
      POSTGRES_DB: dispatch_geo_db
    ports:
      - "5432:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "example"]
      interval: 5s
      timeout: 5s
      retries: 5