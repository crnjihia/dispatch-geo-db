name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start PostGIS & pgRouting Database
        run: docker compose up -d

      - name: Await Database Healthcheck
        run: |
          for i in {1..30}; do
            if docker compose exec -T db pg_isready -U example -d dispatch_geo_db; then
              echo "Database is ready!"
              break
            fi
            echo "Waiting for PostgreSQL ($i/30)..."
            sleep 2
          done

      - name: Execute SQL Integration Tests
        run: docker compose exec -T db psql -U example -d dispatch_geo_db -f /tests/test_suite.sql

      - name: Run KNN Spatial Benchmark
        run: docker compose exec -T db psql -U example -d dispatch_geo_db -f /benchmarks/knn_benchmark.sql

      - name: Run Heatmap Concurrent Refresh Benchmark
        run: docker compose exec -T db psql -U example -d dispatch_geo_db -f /benchmarks/heatmap_refresh.sql

      - name: Teardown
        if: always()
        run: docker compose down -v
